[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eshop-common"
version = "0.1.0"
description = "Shared Python foundation for eShopOnContainers FastAPI services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "structlog>=24.4",
    "tenacity>=9.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "grpcio>=1.66",
    "aio-pika>=9.4",
    "azure-servicebus>=7.12",
    "aiohttp>=3.10",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aioodbc>=0.5",
    "pyodbc>=5.1",
    "redis>=5.1",
    "pyjwt[crypto]>=2.9",
    "motor>=3.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
    "grpcio-tools>=1.66",
]

[tool.setuptools.packages.find]
include = ["eshop_common*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require live dependencies (SQL Server, RabbitMQ, Redis, MongoDB)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

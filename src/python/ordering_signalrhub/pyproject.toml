[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ordering-signalrhub"
version = "0.1.0"
description = "Python replacement for Ordering.SignalrHub (Socket.IO realtime order-status notifications)"
requires-python = ">=3.12"
dependencies = [
    "eshop-common",
    "python-socketio>=5.11",
    "uvicorn[standard]>=0.32",
    "redis>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "python-socketio[asyncio_client]>=5.11",
    "cryptography>=43.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["ordering_signalrhub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require live dependencies (RabbitMQ)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-api"
version = "0.1.0"
description = "eShopOnContainers Payment microservice (FastAPI, contract-preserving .NET replacement)"
requires-python = ">=3.12"
dependencies = [
    "eshop-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "structlog>=24.4",
    "tenacity>=9.0",
    "aio-pika>=9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["payment_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require live dependencies (RabbitMQ)",
]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["eshop_common.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
